<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<title>AutoFolio 새 채용 양식 검증</title>
<!-- A guess at newer forms (recruiter.co.kr v1): labels in plain <div>s, sample values as
     placeholders, and each gender radio with its own name. -->
<script>
  let listener;
  window.chrome = { runtime: { onMessage: { addListener(callback) { listener = callback; }, removeListener() {} } } };
</script>
<div class="group"><div class="group-title">기본정보</div>
  <div class="form-item"><div class="form-label">이름</div><div class="form-input"><input name="basicInfoGroupAnswers.name" placeholder="홍길동"></div></div>
  <div class="form-item"><div class="form-label">생년월일</div><div class="form-input"><input placeholder="YYYY.MM.DD"></div></div>
  <div class="form-item"><div class="form-label">성별</div>
    <div class="radios"><input type="radio" name="남"><label>남</label><input type="radio" name="여"><label>여</label></div></div>
  <div class="form-item"><div class="form-label">휴대폰</div><div class="form-input"><input name="basicInfoGroupAnswers.mobilePhone" placeholder="010-1234-1234"></div></div>
</div>
<script src="../extension/option-match.js"></script>
<script src="../extension/content.js"></script>
<script type="module">
  import { classify } from "../extension/matcher.js";
  const send = message => new Promise(resolve => listener(message, null, resolve));
  const { fields } = await send({ action: "scan" });
  const byLabel = Object.fromEntries(fields.map(field => [field.label, field]));
  const values = { "personal.name": "김예시", "personal.birthDate": "19990131", "personal.gender": "여", "personal.phone": "010-0000-0000" };
  const items = fields.map(field => ({ token: field.token, value: values[classify(field).type] })).filter(item => item.value);
  const { results } = await send({ action: "fill", items });
  const radios = document.querySelectorAll("input[type='radio']");
  const checks = {
    labelsFromDivs: ["이름", "생년월일", "성별", "휴대폰"].every(label => byLabel[label]),
    section: byLabel["이름"]?.section === "기본정보",
    genderIsOneQuestion: fields.filter(field => field.inputType === "radio").length === 1 &&
      byLabel["성별"]?.options.map(option => option.text).join() === "남,여",
    classified: classify(byLabel["생년월일"]).type === "personal.birthDate" && classify(byLabel["성별"]).type === "personal.gender",
    filled: results.length === 4 && results.every(result => result.status === "filled"),
    birthdayFormat: document.querySelectorAll("input")[1].value === "1999.01.31",
    genderPicked: !radios[0].checked && radios[1].checked
  };
  const failed = Object.entries(checks).filter(([, ok]) => !ok).map(([name]) => name);
  document.body.dataset.testResult = failed.length ? "FAIL" : "PASS";
  document.body.dataset.testDetails = JSON.stringify({ failed, fields: fields.map(field => [field.label, field.section, field.name]), results });
</script>
</html>
