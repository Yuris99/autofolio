<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoFolio 내 이력</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="options">
  <main>
    <h1>내 이력 <small id="version" class="muted"></small></h1>
    <p class="muted">입력한 정보는 이 브라우저의 확장 프로그램 저장소에만 보관됩니다. 입력하면 자동으로 저장됩니다. 빈 항목은 자동 입력하지 않습니다. 날짜는 2024.02.20처럼 적으면 됩니다.</p>
    <section class="backup">
      <h2>백업</h2>
      <p class="muted">확장 프로그램을 삭제하면 저장한 이력도 사라집니다. 파일로 내려받아 두었다가 다른 PC나 재설치 후에 불러오세요. 백업 파일에는 개인정보가 들어 있으니 공유하지 마세요.</p>
      <div class="actions">
        <button type="button" id="export" class="secondary">파일로 내려받기</button>
        <button type="button" id="import" class="secondary">파일에서 불러오기</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
      </div>
    </section>
    <form id="profileForm"></form>
    <div class="savebar"><button type="submit" form="profileForm">이력 저장</button><span id="saved" role="status"></span></div>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
