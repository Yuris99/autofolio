# AutoFolio 이력 예시.
# 복사해서 실제 이력으로 채우세요:  cp profile.example.yaml data/profile.yaml
# data/ 는 gitignore 대상이라 커밋되지 않습니다.
#
# 원칙: 실제 이력만 적습니다. AutoFolio는 여기에 없는 내용을 만들어 입력하지 않습니다.
# 날짜 형식: "YYYY-MM-DD" (따옴표 권장)

personal:
  name: 홍길동
  gender: 남            # 남 | 여
  birthday: "2000-01-01"
  phone: 010-0000-0000
  email: example@example.com
  address:
    zipCode: "00000"
    address: 서울특별시 동작구 상도로 369
    detail: 101동 101호

education:
  - level: 고등학교
    school: 예시고등학교
    entranceDate: "2016-03-02"
    graduationDate: "2019-02-10"
    status: 졸업

  - level: 대학교       # 고등학교 | 대학교 | 대학원
    school: 숭실대학교    # 학교 검색 결과의 이름과 정확히 같게
    major: 소프트웨어학부
    degree: 학사
    entranceType: 입학    # 입학 | 편입
    entranceDate: "2019-03-02"
    graduationDate: "2026-02-20"
    status: 졸업예정      # 졸업 | 졸업예정 | 재학 | 휴학 | 중퇴 | 수료
    gpa: 3.8
    gpaScale: 4.5

certificates:
  - name: 정보처리기사     # 자격증 검색 결과의 이름과 정확히 같게
    issuer: 한국산업인력공단
    registrationNumber: "00000000000A"
    acquiredDate: "2025-06-13"
  - name: SQLD
    issuer: 한국데이터산업진흥원
    registrationNumber: SQLD-000000000
    acquiredDate: "2024-12-20"
